<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boleta de Venta</title>
  <style type="text/css">
    /* ===== Base ===== */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;padding:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#0057d1;          /* azul fijo */
      color:#111;
    }
    .wrap{
      max-width:1180px;
      margin:18px auto;
      background:#fff;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
      overflow:hidden;
    }
    .toolbar{
      display:flex; align-items:center; gap:16px;
      padding:12px 16px; background:#f3f6fb; border-bottom:1px solid #e5ecf6;
    }
    .toolbar h1{margin:0; font-size:18px; font-weight:700; color:#0f172a}
    .toolbar .spacer{flex:1}
    .btn{border:1px solid #d1d9e6; background:#fff; padding:6px 10px; border-radius:8px; font-size:13px; cursor:pointer}
    .btn.primary{background:#0057d1; color:#fff; border-color:#0057d1}

    /* ===== Tabs ===== */
    .tabs{display:flex; gap:6px; padding:8px 12px; background:#f8fafc; border-bottom:1px solid #e5ecf6}
    .tab{padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600; color:#334155}
    .tab.active{background:#0057d1; color:#fff}

    /* ===== Página ===== */
    .page{display:none; padding:16px}
    .page.active{display:block}

    /* ===== Radios Afecto/Exento ===== */
    .impuestos{display:flex; gap:18px; align-items:center; margin:4px 0 12px 2px}
    .impuestos label{font-weight:600; color:#1f2937}

    /* ===== Grid cabecera (Página 1) =====
       Columnas:  label | campo corto | campo largo | label derecha | campo derecha
    */
    .grid5{
      display:grid;
      grid-template-columns: 120px 1fr 1.2fr 120px 1fr;
      gap:8px 10px;
      align-items:center;
    }
    .grid5 label{justify-self:end; color:#374151; font-size:13px}
    .grid5 input[type=text],
    .grid5 input[type=number],
    .grid5 input[type=date],
    .grid5 select{
      width:100%; padding:7px 8px; border:1px solid #cfd8e3; border-radius:8px; background:#fff;
      font-size:13px;
    }
    .readonly{background:#f8fafc}

    /* ===== Tabla de líneas ===== */
    .lines{
      margin-top:14px; border:1px solid #e5ecf6; border-radius:10px; overflow:auto;
    }
    table{width:100%; border-collapse:separate; border-spacing:0}
    thead th{
      background:#f3f6fb; color:#0f172a; text-align:left; padding:10px 8px; font-size:12px;
      border-bottom:1px solid #e5ecf6;
      position:sticky; top:0; z-index:1;
    }
    tbody td{padding:8px; border-bottom:1px solid #eef2f7; font-size:13px}
    tbody tr:hover{background:#fafcff}

    /* ===== Panel totales ===== */
    .foot{
      display:grid; grid-template-columns: 1fr 320px; gap:16px; margin-top:12px;
    }
    .checks, .pago{background:#f8fafc; border:1px solid #e5ecf6; border-radius:10px; padding:10px}
    .checks label{margin-right:12px; font-size:13px}
    .pago .row{display:grid; grid-template-columns:140px 1fr; gap:8px; align-items:center; margin-bottom:8px}
    .totales{
      background:#f8fafc; border:1px solid #e5ecf6; border-radius:12px; padding:12px;
      height:max-content;
    }
    .totales h3{margin:0 0 8px; font-size:14px}
    .total-row{display:grid; grid-template-columns:1fr 120px; gap:8px; margin:6px 0; font-size:13px}
    .total-row .num{justify-self:end; background:#fff; border:1px solid #dde6f2; border-radius:8px; padding:6px 8px; min-width:0; text-align:right}

    /* ===== Página 2 (contable y obs) ===== */
    .grid4{display:grid; grid-template-columns: 140px 1fr 140px 1fr; gap:8px 10px; align-items:center}
    .grid4 label{justify-self:end; color:#374151; font-size:13px}
    textarea{width:100%; min-height:160px; resize:vertical; padding:10px; border:1px solid #cfd8e3; border-radius:10px; font-size:13px}
    .side-link{font-size:12px; color:#0057d1; text-decoration:none; font-weight:700}

    /* ===== RF (QVGA 320x240 aprox) ===== */
    @media (max-width: 360px){
      .wrap{margin:0; border-radius:0}
      .grid5{grid-template-columns: 86px 1fr; }
      .grid5 label{justify-self:start}
      .grid5 .right{grid-column: 1 / -1} /* Forzar que el par derecho baje */
      .foot{grid-template-columns:1fr}
      .totales{order:-1}
      .pago .row{grid-template-columns:100px 1fr}
      thead th{font-size:11px}
      tbody td{font-size:12px; padding:6px}
    }
  </style>
</head>
<body>

<div class="wrap">
  <!-- ===== Barra superior ===== -->
  <div class="toolbar">
    <h1>Boleta de Venta</h1>
    <div class="spacer"></div>
    <button class="btn">Buscar</button>
    <button class="btn">Borrar</button>
    <button class="btn">Imprimir</button>
    <button class="btn primary">Guardar</button>
  </div>

  <!-- ===== Tabs ===== -->
  <div class="tabs">
    <div class="tab active" data-tab="p1">Página 1</div>
    <div class="tab" data-tab="p2">Página 2</div>
  </div>

  <!-- ===== Página 1 ===== -->
  <div class="page active" id="p1">

    <div class="impuestos">
      <label><input type="radio" name="afecto" checked> Afecto</label>
      <label><input type="radio" name="afecto"> Exento</label>
    </div>

    <div class="grid5">

      <!-- Fila 1 -->
      <label for="bol">Bol N°</label>
      <input id="bol" name="bol" type="text">
      <div></div>
      <label for="tipoventa" class="right">Tipo Venta</label>
      <select id="tipoventa" name="tipoventa">
        <option value="">-- Seleccione --</option>
        <option>Contado</option>
        <option>Crédito</option>
      </select>

      <label for="fecha">Fecha</label>
      <input id="fecha" name="fecha" type="date">
      <div></div>
      <label for="ot" class="right">OT N°</label>
      <input id="ot" name="ot" type="text">

      <!-- Fila 2 (Cliente 2 campos + OT a la derecha ya arriba) -->
      <label for="cliente_cod">Cliente</label>
      <input id="cliente_cod" name="cliente_cod" type="text" placeholder="Código">
      <input id="cliente_nom" name="cliente_nom" type="text" class="readonly" placeholder="Razón Social">
      <label for="moneda" class="right">Moneda</label>
      <select id="moneda" name="moneda">
        <option>CLP</option>
        <option>USD</option>
      </select>

      <!-- Fila 3 -->
      <label for="comisionista_cod">Comisionista</label>
      <input id="comisionista_cod" name="comisionista_cod" type="text" placeholder="Código">
      <input id="comisionista_nom" name="comisionista_nom" type="text" class="readonly" placeholder="Nombre">
      <label for="monto_moneda" class="right">Monto</label>
      <input id="monto_moneda" name="monto_moneda" type="number" step="0.000001" value="0.000000" style="text-align:right">

      <!-- Fila 4 -->
      <label for="vendedor_cod">Vendedor</label>
      <input id="vendedor_cod" name="vendedor_cod" type="text" placeholder="Código">
      <input id="vendedor_nom" name="vendedor_nom" type="text" class="readonly" placeholder="Nombre">
      <label for="comision" class="right">Comisión</label>
      <input id="comision" name="comision" type="number" step="0.01" placeholder="%">

      <!-- Fila 5 -->
      <label for="atencion">Atención a</label>
      <input id="atencion" name="atencion" type="text" style="grid-column: span 2;">
      <label for="descuento_chk" class="right">Descuento</label>
      <div>
        <input id="descuento_chk" type="checkbox"> <input id="descuento" name="descuento" type="number" step="0.01" placeholder="%" style="width:90px;">
      </div>

      <!-- Fila 6 -->
      <label for="sucursal_cod">Sucursal</label>
      <input id="sucursal_cod" name="sucursal_cod" type="text" value="ST" style="max-width:90px">
      <input id="sucursal_nom" name="sucursal_nom" type="text" class="readonly" value="Sucursal Santiago">
      <div class="right"></div>
      <div></div>
    </div>

    <!-- ===== Tabla de líneas ===== -->
    <div class="lines">
      <table>
        <thead>
          <tr>
            <th style="width:140px">Código</th>
            <th>Descripción</th>
            <th style="width:120px">Cantidad</th>
            <th style="width:120px">Precio</th>
            <th style="width:90px">D%</th>
          </tr>
        </thead>
        <tbody id="tbody-items">
          <tr>
            <td><input type="text" style="width:100%"></td>
            <td><input type="text" style="width:100%"></td>
            <td><input type="number" step="1" min="0" style="width:100%; text-align:right"></td>
            <td><input type="number" step="0.01" min="0" style="width:100%; text-align:right"></td>
            <td><input type="number" step="0.01" min="0" style="width:100%; text-align:right"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ===== Pie: checks / pago / totales ===== -->
    <div class="foot">

      <div>
        <div class="checks">
          <label><input type="checkbox" name="rebaja_stock"> Rebaja Stock</label>
          <label><input type="checkbox" name="nula"> Nula</label>
          <label><input type="checkbox" name="bo"> Bo</label>
          &nbsp;&nbsp;&nbsp; <b>IndServicio</b> <input type="text" style="width:120px; padding:6px 8px; border:1px solid #cfd8e3; border-radius:8px">
        </div>

        <div class="pago" style="margin-top:10px">
          <div class="row">
            <div>Detalles de pago…</div>
            <button class="btn">Abrir</button>
          </div>
          <div class="row">
            <label for="forma_pago">Forma de Pago</label>
            <select id="forma_pago" name="forma_pago">
              <option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option>
            </select>
          </div>
          <div class="row">
            <label for="glosa_pago">Glosa Pago</label>
            <input id="glosa_pago" name="glosa_pago" type="text">
          </div>
        </div>
      </div>

      <div class="totales">
        <h3>Totales</h3>
        <div class="total-row"><div>Afecto</div><div class="num"><input type="number" step="0.01" value="0" style="width:100%; border:0; text-align:right"></div></div>
        <div class="total-row"><div>Exento</div><div class="num"><input type="number" step="0.01" value="0" style="width:100%; border:0; text-align:right"></div></div>
        <div class="total-row"><div>Neto</div><div class="num"><input type="number" step="0.01" value="0" style="width:100%; border:0; text-align:right"></div></div>
        <div class="total-row"><div>IVA <span id="iva_pct">19 %</span></div><div class="num"><input type="number" step="0.01" value="0" style="width:100%; border:0; text-align:right"></div></div>
        <div class="total-row"><div>Otros Imp1</div><div class="num"><input type="number" step="0.01" value="0" style="width:100%; border:0; text-align:right"></div></div>
        <div class="total-row"><div>Otros Imp2</div><div class="num"><input type="number" step="0.01" value="0" style="width:100%; border:0; text-align:right"></div></div>
        <div class="total-row" style="font-weight:800"><div>Total</div><div class="num"><input type="number" step="0.01" value="0" style="width:100%; border:0; text-align:right; font-weight:800"></div></div>
      </div>

    </div>

  </div>

  <!-- ===== Página 2 ===== -->
  <div class="page" id="p2">

    <div class="grid4">
      <label for="aten2">Atención a</label>
      <input id="aten2" type="text">

      <label for="cta">Cta Contable</label>
      <input id="cta" type="text">

      <label for="cc">Centro Costo</label>
      <input id="cc" type="text">

      <label for="glosa_cont">Glosa Contable</label>
      <input id="glosa_cont" type="text">

      <label for="caja">Caja N°</label>
      <input id="caja" type="text">

      <label for="turno">Turno</label>
      <input id="turno" type="text">

      <label for="rutmand">Rut Mandante</label>
      <input id="rutmand" type="text">
    </div>

    <div style="margin-top:12px; display:flex; align-items:center; justify-content:space-between">
      <div style="font-weight:700">Observaciones</div>
      <a href="#" class="side-link">Ingresar Referencias</a>
    </div>
    <textarea id="obs"></textarea>

    <div style="text-align:center; color:#64748b; margin-top:10px">– Página 2 –</div>
  </div>

</div>

<script>
  // Tabs
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.tab).classList.add('active');
    });
  });
</script>

</body>
</html>

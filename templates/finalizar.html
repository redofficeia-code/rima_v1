<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <!-- útil en navegadores móviles embebidos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalización de Recepción</title>
  <style type="text/css">
    /* ===== Base / Reset ===== */
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background:#00c0cb;
      background:-webkit-linear-gradient(left,#00c0cb,#0057d1);
      background:   -moz-linear-gradient(left,#00c0cb,#0057d1);
      background:        linear-gradient(to right,#00c0cb,#0057d1);
      color:#333;
      text-align:center;
      -webkit-text-size-adjust:100%;
    }

    /* ===== Contenedor ===== */
    .container {
      width:94%;
      max-width:640px;
      margin:16px auto;
      background:#fff;
      border-radius:12px;
      padding:16px 16px 20px;
      -webkit-box-shadow:2px 2px 8px rgba(0,0,0,.2);
              box-shadow:2px 2px 8px rgba(0,0,0,.2);
    }

    .top-link {
      display:inline-block;
      margin:10px auto 8px;
      background:#0d47a1;
      color:#fff;
      text-decoration:none;
      padding:8px 14px;
      border-radius:10px;
      font-weight:bold;
    }

    h2 { margin:8px 0 6px; color:#0d47a1; font-size:22px; }
    p  { margin:6px 0 16px; font-size:16px; }

    /* ===== Botones táctiles (como <a>) ===== */
    .btn {
      display:block;       /* 100% ancho en móvil */
      width:100%;
      text-align:center;
      text-decoration:none;
      background:#0d47a1;
      color:#fff;
      border-radius:10px;
      padding:14px 12px;   /* alto táctil >= 44px */
      margin:10px 0;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }
    .btn:focus, .btn:hover { background:#00c0cb; color:#0d47a1; }

    .btn-secondary { background:#6c757d; }
    .btn-secondary:focus, .btn-secondary:hover { background:#8a8f94; color:#fff; }

    /* ===== Grid simple en pantallas anchas ===== */
    .btn-grid { width:100%; }
    @media (min-width:560px) {
      .btn-grid {
        display:-ms-flexbox; display:flex;
        -ms-flex-wrap:wrap; flex-wrap:wrap;
        -ms-flex-pack:justify; justify-content:space-between;
        gap:12px;
      }
      .btn-grid .btn { width:48%; margin:6px 0; } /* dos columnas */
      .btn-grid .btn.full { width:100%; }
    }
  </style>
</head>
<body>

  <a class="top-link" href="{{ url_for('index') }}">Inicio</a>

  <div class="container">
    <h2>Recepción Finalizada</h2>
    <p>Puedes descargar los siguientes documentos:</p>

    <div class="btn-grid">
      <a class="btn full" href="/ingreso/diferencias.xls">📊 Descargar Informe de Diferencias</a>
      <a class="btn full" href="/ingreso/guia.xls">📦 Descargar Guía de Recepción</a>
    </div>

    <a class="btn btn-secondary full" href="{{ url_for('ingreso') }}">🔙 Volver al Inicio</a>
  </div>

</body>
</html>

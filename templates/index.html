<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menú WMS</title>
  <style type="text/css">
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0057d1;
      background: -webkit-linear-gradient(left, #00c0cb, #0057d1);
      background: linear-gradient(to right, #00c0cb, #0057d1);
      color: #fff; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* Barra superior */
    .topbar { text-align: right; padding: 10px 12px; }
    .topbar a { color: #fff; text-decoration: none; font-weight: 600; }
    .topbar a:active { position: relative; top: 1px; }

    /* Contenedor principal */
    .container { width: 95%; max-width: 1000px; margin: 8px auto 16px; }

    /* Logo */
    .logo { display: block; max-width: 260px; width: 60%; height: auto; margin: -12px auto 8px; }

    /* Grupos de botones */
    .group {
      display: -webkit-box; display: -ms-flexbox; display: flex;
      -ms-flex-wrap: wrap; flex-wrap: wrap;
      -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
      gap: 12px; margin: 12px 0 18px;
    }

    /* Botón base */
    .tile {
      display: block; position: relative;
      background: #0057d1; border-radius: 12px;
      box-shadow: 2px 2px 6px rgba(0,0,0,.35);
      text-decoration: none; color: #fff; overflow: hidden;
      transition: background .15s ease;
      min-width: 120px; min-height: 44px;
    }
    .tile:active { top: 1px; }
    .tile:hover { background: #00c0cb; }

    /* Texto dentro del botón */
    .tile > span {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-weight: 800; letter-spacing: .3px;
      white-space: nowrap;
    }

    /* Desktop */
    .primary .tile   { width: 31%; padding-bottom: 31%; font-size: 20px; }
    .secondary .tile { width: 18%; padding-bottom: 18%; font-size: 16px; }

    /* Responsive móvil */
    @media screen and (max-width: 760px) {
      .logo { width: 72%; max-width: 300px; }
      .primary .tile, .secondary .tile {
        width: 46%; padding-bottom: 46%; font-size: 18px;
      }
      .secondary .tile.wide { width: 94%; padding-bottom: 24%; font-size: 18px; }
    }
    @media screen and (max-width: 420px) {
      .primary .tile, .secondary .tile { width: 48%; padding-bottom: 48%; font-size: 17px; }
      .secondary .tile.wide { width: 96%; padding-bottom: 26%; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="{{ url_for('logout') }}">Salir</a>
  </div>

  <div class="container">
    <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="Logo" class="logo">

    <!-- fila 1 -->
    <div class="group primary">
      <a href="{{ url_for('ingreso') }}" class="tile"><span>INGRESO</span></a>
      <a href="{{ url_for('salida') }}" class="tile"><span>SALIDA</span></a>
    </div>

    <!-- fila 2 -->
    <div class="group secondary">
      <a href="{{ url_for('listados') }}" class="tile"><span>LISTADOS</span></a>
      <a href="{{ url_for('inventario') }}" class="tile"><span>INVENTARIO</span></a>
      <a href="{{ url_for('devoluciones') }}" class="tile wide"><span>DEVOLUCIONES</span></a>
    </div>
  </div>
</body>
</html>

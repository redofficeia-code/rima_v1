<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devoluciones – WMS</title>
  <style type="text/css">
    *, *:before, *:after { box-sizing: border-box; }
    body {
      margin:0; padding:0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(to right, #00c0cb, #0057d1);
      color:#fff; text-align:center;
    }
    .container { width:94%; max-width:1000px; margin:1em auto; }

    header {
      font-size:28px; font-weight:bold;
      color:#ffeb0c; text-shadow:1px 1px 2px #000;
      margin:0 0 16px 0;
    }

    /* --- Grid de botones (sin flex, compatible) --- */
    .primary { zoom:1; margin:0 -1%; }
    .primary:after { content:""; display:block; clear:both; }
    .card {
      float:left; width:48%; margin:1%;
      background:#0057d1; border-radius:14px;
      box-shadow:2px 2px 6px rgba(0,0,0,.3);
      position:relative; text-decoration:none; color:#fff;
      /* cuadrado: alto relativo al ancho */
      padding-top:48%; /* 1:1 aproximado con márgenes */
      transition: background .2s ease;
    }
    .card:hover { background:#00c0cb; color:#003a88; }

    .card span {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-weight:bold; font-size:18px; white-space:nowrap;
    }

    /* Botón Inicio */
    .btn-home {
      display:inline-block; margin:16px 0;
      background:#ffc107; color:#000; text-decoration:none;
      padding:10px 16px; border-radius:10px; font-weight:bold;
      box-shadow:2px 2px 6px rgba(0,0,0,.25);
    }
    .btn-home:hover { background:#ffdd57; }

    /* --- Responsive --- */
    @media (max-width: 720px) {
      header { font-size:24px; }
      .card { width:98%; margin:1% 1%; padding-top:36%; } /* más chatas para no hacer scroll */
      .card span { font-size:20px; white-space:normal; padding:0 8px; }
      .btn-home { display:block; width:100%; }
    }
    @media (max-width: 420px) {
      .card { padding-top:34%; }
      .card span { font-size:18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>DEVOLUCIONES</header>

    <div class="primary" role="navigation" aria-label="Menú de Devoluciones">
      <a class="card" href="{{ url_for('devolucion_ingreso') }}">
        <span>DEVOLUCIONES DE CLIENTE</span>
      </a>
      <a class="card" href="{{ url_for('devoluciones_salida') }}">
        <span>DEVOLUCIONES A PROVEEDORES</span>
      </a>
    </div>

    <a href="{{ url_for('index') }}" class="btn-home">Inicio</a>
  </div>
</body>
</html>

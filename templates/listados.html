<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Listados – WMS App Bodega</title>
  <style type="text/css">
    /* ====== ESTILO POR DEFECTO (RF: 320x240) ====== */
    body{
      margin:0; padding:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#0057d1;  /* mismo fondo que index */
      color:#fff; text-align:center;
    }
    .logo{
      margin:2px auto 4px;
      display:block;
      height:22px;
    }
    .row{ width:100%; text-align:center; }
    .btn{
      display:inline-block;
      margin:4px;
      background:#0a55d8;
      color:#fff;
      text-decoration:none;
      font-weight:bold;
      border-radius:4px;
      border:1px solid #003a99;
      box-shadow: 0 4px 10px rgba(0,0,0,.25);
    }
    .btn-big   { width:146px; height:92px; line-height:92px; font-size:14px; }
    .btn-small { width:146px; height:92px; line-height:92px; font-size:14px; }

    /* ====== SALIR arriba a la derecha ====== */
    .logout-link{
      position:fixed;
      top:6px; right:8px;
      padding:4px 8px;
      font-weight:bold;
      color:#fff;
      text-decoration:none;
      border-radius:4px;
      opacity:.9;
    }
    .logout-link:hover{ text-decoration:underline; opacity:1; }

    /* ====== PC / PANTALLAS GRANDES ====== */
    @media (min-width:600px){
      .logo{ margin:10px auto; max-width:320px; height:auto; max-height:80px; }
      .btn-big{ width:300px; height:220px; font-size:22px; line-height:220px; }
      .btn-small{ width:220px; height:160px; font-size:18px; line-height:160px; }
      .logout-link{ top:10px; right:14px; padding:6px 10px; font-size:16px; }
    }
  </style>
</head>
<body>

  <!-- Salir -->
  <a href="{{ url_for('logout') }}" class="logout-link">Salir</a>

  <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="RIMA" class="logo">

  <h2 style="margin-top:10px;">LISTADOS</h2>

  <div class="row">
    {% if session.get('role') not in ['admin','cargar'] %}
      <a href="{{ url_for('listado_oc') }}" class="btn btn-small">ÓRDENES DE COMPRA</a>
    {% endif %}
    <a href="{{ url_for('listado_nv') }}" class="btn btn-small">NOTAS DE VENTA</a>
  </div>

  {% if session.get('role') in ['admin','cargar'] %}
    <div class="row">
      <a href="{{ url_for('zonas_admin') }}" class="btn btn-small">GESTIONAR ZONAS</a>
    </div>
  {% endif %}

  <div class="row">
    <a href="{{ url_for('index') }}" class="btn btn-small" style="background:#ffc107;color:#333;border:1px solid #996600;">INICIO</a>
  </div>

</body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importar Archivos – App Bodega</title>
  <style type="text/css">
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#00c0cb;
      background:-webkit-linear-gradient(left,#00c0cb,#0057d1);
      background:   -moz-linear-gradient(left,#00c0cb,#0057d1);
      background:        linear-gradient(to right,#00c0cb,#0057d1);
      color:#333;
      -webkit-text-size-adjust:100%;
      text-align:center;
    }

    .container{
      width:94%;max-width:800px;
      margin:16px auto;
      background:#fff;
      border-radius:12px;
      padding:18px 16px 22px;
      -webkit-box-shadow:2px 2px 8px rgba(0,0,0,.2);
              box-shadow:2px 2px 8px rgba(0,0,0,.2);
      text-align:left;
    }

    h1{margin:8px 0 18px;text-align:center;color:#0d47a1}

    label{display:block;font-weight:bold;margin:12px 0 6px}
    select,input[type="file"],.btn{
      display:block;width:100%;
      padding:12px 10px;
      font-size:16px;
      border:1px solid #cfd6e4;
      border-radius:8px;
      margin-bottom:14px;
    }

    .btn{
      background:#0d47a1;color:#fff;
      font-weight:bold;cursor:pointer;
      text-align:center;text-decoration:none;
      border:0;
    }
    .btn:focus,.btn:hover{background:#00c0cb;color:#0d47a1}

    .top-link{
      display:inline-block;margin:10px auto;
      background:#0d47a1;color:#fff;
      text-decoration:none;
      padding:8px 14px;border-radius:10px;font-weight:bold;
    }

    /* Mensajes flash */
    .flash{padding:10px;border-radius:8px;margin-bottom:12px}
    .flash-success{background:#d4edda;color:#155724}
    .flash-warning{background:#fff3cd;color:#856404}
    .flash-error{background:#f8d7da;color:#721c24}
  </style>
</head>
<body>

  <a class="top-link" href="{{ url_for('index') }}">Inicio</a>

  <div class="container">
    <h1>Importar Datos</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
      <label for="tipo">Tipo de archivo a importar:</label>
      <select name="tipo" id="tipo" required>
        <option value="">-- Selecciona --</option>
        <option value="oc">Órdenes de Compra</option>
        <option value="nv">Notas de Venta</option>
        <option value="stock">Stock</option>
        <option value="master">Maestra de Productos</option>
      </select>

      <label for="file">Archivo (CSV, XLS o XLSX):</label>
      <input type="file" name="file" id="file" accept=".csv,.xls,.xlsx" required>

      <button type="submit" class="btn">Importar</button>
    </form>
  </div>

</body>
</html>

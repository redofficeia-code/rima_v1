<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="HandheldFriendly" content="true">
  <meta name="MobileOptimized" content="320">
  <meta http-equiv="cleartype" content="on">

  <title>Login 1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

  <style>
    @-ms-viewport { width: device-width; }

    html, body {
      height: 100%;
      -ms-text-size-adjust: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0057d1;
      color: #111;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo SIEMPRE centrado */
    .logo {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 20px 0 10px;
    }
    .logo img {
      max-width: 100px;
      height: auto;
    }

    .login-box {
      width: 90%;
      max-width: 360px;
      margin: 10px auto 20px;
      padding: 10px 10px;
      background: #fff;
      border: 1px solid #d9e2ef;
      border-radius: 8px;
      text-align: left;
    }

    .login-box h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 16px;
    }

    .login-box ul {
      margin: 6px 0 8px;
      padding-left: 18px;
      font-size: 12px;
      color: #b00020;
    }

    label { display:block; margin:6px 0 4px; font-size:13px; }

    select,
    input[type="text"],
    input[type="password"],
    textarea {
      display: block;
      width: 96%;
      max-width: 100%;
      font-size: 18px !important;
      line-height: 1.35 !important;
      padding: 9px 10px !important;
      min-height: 34px !important;
      border-radius: 8px;
      border: 1px solid #cfd7e6;
      box-sizing: border-box;
    }

    button {
      display: block;
      width: 96%;
      font-size: 18px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 0;
      background: #0057d1;
      color: #fff;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
    }

    @media screen and (min-width: 600px) {
      .logo img { max-width: 130px; }
      .login-box { width: 88%; padding: 12px 14px; border-radius: 10px; }
      .login-box h1 { font-size: 18px; margin-bottom: 10px; }
      label { font-size: 14px; }
      select, input[type="text"], input[type="password"], button {
        width: 97%;
        font-size: 18px; padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="RIMA">
  </div>

  <div class="login-box">
    <h1>Ingreso</h1>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}
        <ul>
          {% for cat, m in msgs %}
            <li>{{ m }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login1') }}">
      <label for="usuario">Usuario</label>
      <select id="usuario" name="usuario" required>
        {% for value, label in usuarios %}
          <option value="{{ value }}"{% if value == selected_usuario %} selected{% endif %}>
            {{ label }}
          </option>
        {% endfor %}
      </select>

      <label for="clave">Contraseña</label>
      <input id="clave" type="password" name="clave" required autocomplete="off" inputmode="none">

      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>

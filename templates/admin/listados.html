<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <!-- Necesario para RF/móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestionar listados</title>
  <style type="text/css">
    /* ==== Micro-kit responsive (HTML4-safe) ==== */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #111827;
      -webkit-tap-highlight-color: transparent;
    }
    .page-wrap {
      max-width: 900px;
      margin: 16px auto;
      padding: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 16px;
      text-align: center;
      text-transform: uppercase;
    }
    p { margin: 12px 0; }

    /* Botones/enlaces táctiles */
    .btn {
      display: inline-block;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #e0e6ef;
      background: #0057d1;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      margin: 6px 0;
    }
    .btn:active { position: relative; top: 1px; }
    .btn.secondary {
      background: #ffd400;
      color: #111827;
      border-color: #d6b600;
    }

    /* Responsive helpers */
    @media screen and (max-width: 600px) {
      .btn { display:block; width:100%; text-align:center; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h1>Gestionar listados</h1>

    <p>Aquí va la UI de gestión que ya tengas o quieras agregar.</p>

    <p>
      <a href="{{ url_for('admin_index') }}" class="btn">Volver al Panel</a>
    </p>
    <p>
      <a href="{{ url_for('index') }}" class="btn secondary">Inicio</a>
    </p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Administración</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: sans-serif;
      background: linear-gradient(to right, #00c0cb, #0057d1);
      color: white;
      text-align: center;
    }
    .container {
      width: 95%;
      max-width: 1000px;
      margin: 0.5em auto;
      padding-top: 0%;
      padding-bottom: 10px;
    }
    .primary {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1%;
      margin-bottom: 1;
      padding-top: 10px;
    }
    .primary a {
      display: block;
      text-decoration: none;
      background: #0057d1;
      border-radius: 12px;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      position: relative;
      transition: background .2s;
      width: 30%;
      padding-bottom: 30%;
      font-size: 1.2em;
    }
    .primary a span {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      white-space: nowrap;
      color: white;
    }
    .primary a:hover {
      background: #00c0cb;
    }
    @media (max-width: 600px) {
      .primary a {
        width: 40%;
        padding-bottom: 40%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="{{ url_for('static', filename='img/logo2.png') }}"
         alt="Logo"
         style="max-height: 200px; margin: -15px auto;">
    <h1>Panel de Administración</h1>
    <div class="primary">
      <a href="{{ url_for('nv_gestionar') }}">
        <span>GESTIONAR NOTAS DE VENTAS</span>
      </a>
      <a href="{{ url_for('listados') }}">
        <span>LISTADOS</span>
      </a>
    </div>
  </div>
</body>
</html>

<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <!-- Necesario para RF/móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIMA — Menú Admin</title>
  <style type="text/css">
    * { box-sizing: border-box; }
    html, body { height:100%; }
    body {
      margin:0; padding:0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0057d1;
      background: -webkit-linear-gradient(left, #00c0cb, #0057d1);
      background: linear-gradient(to right, #00c0cb, #0057d1);
      color:#fff; text-align:center;
      -webkit-tap-highlight-color: transparent;
    }

    /* Topbar */
    .topbar{ text-align:right; padding:10px; }
    .btn{
      display:inline-block; min-height:44px; padding:10px 16px;
      border-radius:10px; text-decoration:none;
      font-weight:bold; box-shadow:2px 2px 5px rgba(0,0,0,.3);
    }
    .btn-accent{ background:#FFCC00; color:#1a1a1a; }
    .btn-accent:hover{ background:#FFDB4D; }

    /* Contenedor principal */
    .container{ width:95%; max-width:1000px; margin:0.5em auto 1.5em; padding-bottom:10px; }
    .logo{ max-height:200px; margin:-15px auto 10px; display:block; }

    /* Menú de tarjetas */
    .menu{
      display:-webkit-box; display:-ms-flexbox; display:flex;
      -ms-flex-wrap:wrap; flex-wrap:wrap;
      -webkit-box-pack:center; -ms-flex-pack:center; justify-content:center;
      gap:16px; padding-top:20px;
    }
    .menu a{
      display:block; position:relative;
      width:28%; padding-bottom:18%;
      background:#0057d1; border-radius:12px;
      box-shadow:2px 2px 6px rgba(0,0,0,.35);
      text-decoration:none; transition:background .2s;
      min-width:120px; min-height:44px;
    }
    .menu a:hover{ background:#00c0cb; }
    .menu a span{
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      font-weight:800; letter-spacing:.3px;
      white-space:nowrap; color:#fff;
      font-size:16px;
    }

    /* Responsive */
    @media screen and (max-width:900px){
      .menu a{ width:45%; padding-bottom:22%; }
    }
    @media screen and (max-width:600px){
      .menu a{ width:90%; padding-bottom:16%; }
    }
  </style>
</head>
<body>
  <!-- Botón Inicio -->
  <div class="topbar">
    <a class="btn btn-accent" href="{{ url_for('index') }}">Inicio</a>
  </div>

  <div class="container">
    <img class="logo" src="{{ url_for('static', filename='img/logo2.png') }}" alt="Logo RIMA">

    <div class="menu">
      <a href="{{ url_for('admin_zonas') }}"><span>GESTIONAR ZONAS</span></a>
      <a href="{{ url_for('admin_tipos_despacho') }}"><span>GESTIONAR TIPO DESPACHO</span></a>
      <a href="{{ url_for('admin_nv_gestionar') }}"><span>GESTIONAR NOTAS DE VENTA</span></a>
    </div>
  </div>
</body>
</html>

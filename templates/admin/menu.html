<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" 
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIMA — Menú Admin</title>
  <style type="text/css">
    /* ====== ESTILO POR DEFECTO (RF: 320x240) ====== */
    body {
      margin:0; padding:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#0057d1;
      color:#fff;
      text-align:center;
    }
    .topbar { text-align:right; padding:4px; }
    .btn-home {
      display:inline-block;
      padding:4px 8px;
      border-radius:4px;
      background:#FFCC00;
      color:#1a1a1a;
      font-weight:bold;
      text-decoration:none;
    }
    .logo {
      margin:2px auto 4px;
      display:block;
      height:22px;
    }
    .row { width:100%; text-align:center; }

    /* === Botones (basados en index, ajustados) === */
    .btn {
      display:inline-block;
      margin:2px;
      background:#0a55d8;
      color:#fff;
      text-decoration:none;
      font-weight:bold;
      border-radius:4px;
      border:1px solid #003a99;
      line-height:1.2;
      vertical-align:middle;
      overflow:hidden;
    }
    .btn span { display:block; }
    .btn-big {
      width:146px; height:92px;
      font-size:14px;
      padding-top:25px; /* centra el bloque de 2 líneas */
    }
    .btn-small {
      width:94px; height:64px;
      font-size:12px;
      padding-top:18px;
    }

    /* ====== PC / PANTALLAS GRANDES ====== */
    @media (min-width:600px){
      .logo{margin:10px auto;max-width:320px;height:auto;max-height:80px;}
      .btn-big{width:260px;height:140px;font-size:18px;padding-top:45px;}
    }
  </style>
</head>
<body>
  <!-- Botón Inicio -->
  <div class="topbar">
    <a class="btn-home" href="{{ url_for('index') }}">Inicio</a>
  </div>

  <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="RIMA" class="logo">

  <div class="row">
    <a href="{{ url_for('admin_zonas') }}" class="btn btn-big">
      <span>GESTIONAR</span><span>ZONAS</span>
    </a>
    <a href="{{ url_for('admin_tipos_despacho') }}" class="btn btn-big">
      <span>GESTIONAR</span><span>TIPO DESPACHO</span>
    </a>
    <a href="{{ url_for('admin_nv_gestionar') }}" class="btn btn-big">
      <span>GESTIONAR</span><span>NOTAS DE VENTA</span>
    </a>
  </div>
</body>
</html>

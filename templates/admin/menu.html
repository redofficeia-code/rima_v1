<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" 
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIMA — Menú Admin</title>
  <style type="text/css">
    /* ===== RF (Windows CE / Pocket IE) ===== */
    html, body { height:100%; }
    body{
      margin:0;
      padding:0;
      background:#0057d1;
      color:#ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align:center;
    }

    /* Logo pequeño */
    .logo{
      display:block;
      margin:6px auto 4px;
      height:18px;
    }

    /* Botón INICIO (debajo del logo, centrado) */
    .top-home{
      width:100%;
      text-align:center;
      margin:2px 0 8px;
    }
    .btn-home{
      display:inline-block;
      background:#ffcc00;
      color:#1a1a1a;
      text-decoration:none;
      font-weight:bold;
      border:1px solid #b18f00;
      padding:6px 12px;
      border-radius:14px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .btn-home:focus,
    .btn-home:hover{ filter:brightness(0.95); }

    /* Contenedor centrado de botones */
    .wrap{
      width:100%;
      text-align:center;
      margin:4px 0 12px;
      white-space:nowrap;    /* mantiene en una sola fila en RF */
    }

    /* Botones rectangulares */
    .btn{
      display:inline-block;
      vertical-align:top;
      width:88px;
      height:48px;
      margin:0 5px;
      background:#0a55d8;
      color:#fff;
      text-decoration:none;
      border:1px solid #003a99;
      border-radius:4px;
      overflow:hidden;
      padding-top:4px;       /* baja el texto un poquito */
    }
    .btn span{ display:block; line-height:1.1; }
    .btn .l1{ font-size:11px; font-style:italic; }
    .btn .l2{ font-size:11px; font-weight:bold; margin-top:2px; }

    /* ===== PC ===== */
    @media (min-width:600px){
      .logo{ height:auto; max-height:80px; margin:12px auto 8px; }
      .top-home{ margin:6px 0 16px; }
      .wrap{ white-space:normal; margin:12px 0 20px; }
      .btn{ width:260px; height:140px; margin:0 12px; padding-top:20px; }
      .btn .l1{ font-size:18px; font-style:normal; }
      .btn .l2{ font-size:18px; }
      .btn-home{ padding:8px 18px; border-radius:16px; }
    }
  </style>
</head>
<body>

  <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="RIMA" class="logo">

  <!-- INICIO debajo del logo -->
  <div class="top-home">
    <a class="btn-home" href="{{ url_for('index') }}">INICIO</a>
  </div>

  <!-- Botonera principal -->
  <div class="wrap">
    <a href="{{ url_for('admin_nv_gestionar') }}" class="btn">
      <span class="l2">GESTIONAR</span>
      <span class="l2">NOTAS DE VENTA</span>
    </a>
    <a href="{{ url_for('admin_docs_inyeccion') }}" class="btn">
      <span class="l2">ENVIAR</span>
      <span class="l2">DOCUMENTOS</span>
    </a>
    <a href="{{ url_for('admin_zonas') }}" class="btn">
      <span class="l2">GESTIONAR</span>
      <span class="l2">ZONAS</span>
    </a>
  </div>

</body>
</html>

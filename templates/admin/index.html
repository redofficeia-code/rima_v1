<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <!-- La RF lo ignora, pero no molesta en PC -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Menú WMS – Admin</title>
  <style type="text/css">
    /* =======================  PC / TABLET (por defecto)  ======================= */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0; padding:0;
      font-family: Arial, Helvetica, sans-serif;
      color:#fff; text-align:center;
      background: -webkit-linear-gradient(left, #00c0cb, #0057d1);
      background: linear-gradient(to right, #00c0cb, #0057d1);
    }
    .topbar{ text-align:right; padding:12px 16px; font-weight:600; }
    .topbar a{ color:#fff; text-decoration:none; }
    .container{ width:90%; max-width:980px; margin:12px auto 40px; }
    .logo{ display:block; margin:10px auto 10px; max-width:320px; height:auto; }

    .group{
      display:flex; flex-wrap:wrap; justify-content:center; gap:20px;
      margin:18px 0;
    }
    .tile{
      background:#0a55d8; color:#fff; text-decoration:none; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.22);
      transition:transform .08s ease, background .15s ease;
    }
    .tile:hover{ background:#0b63ff; transform:translateY(-1px); }
    .tile > span{ letter-spacing:.4px; }

    /* Tamaños "PC" similares a tu diseño */
    .primary .tile{   width:300px; height:260px; font-size:22px; }
    .secondary .tile{ width:180px; height:160px; font-size:16px; }

    /* =======================  RF OVERRIDE (QVGA 320×240)  ======================= */
    @media screen and (max-width:360px) and (max-height:280px){
      body{ background:#0057d1; }
      .topbar{ padding:4px 6px; font-size:12px; }
      .container{ width:300px; margin:4px auto 6px; text-align:left; }
      .logo{ max-height:32px; width:auto; margin:2px auto 4px; }

      .group{ display:block; margin:0; }
      .tile{
        display:inline-block; vertical-align:top;
        border-radius:0; box-shadow:none; margin:0 6px 6px 0;
        background:#0a55d8; text-align:center;
      }
      .tile > span{ display:block; }

      .primary .tile{
        width:146px;
        height:88px; line-height:88px; font-size:14px;
      }
      .secondary .tile{
        width:94px;
        height:64px; line-height:64px; font-size:12px;
      }
    }

    @media screen and (orientation:portrait) and (max-width:360px) and (max-height:520px){
      .container{ width:300px; }
      .logo{ max-height:44px; }
      .primary .tile{ width:146px; height:96px; line-height:96px; font-size:15px; }
      .secondary .tile{ width:94px; height:72px; line-height:72px; font-size:13px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="{{ url_for('logout') }}">Salir</a>
  </div>

  <div class="container">
    <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="RIMA" class="logo">

    <!-- FILA 1 -->
    <div class="group primary">
      <a href="{{ url_for('ingreso') }}" class="tile"><span>INGRESO</span></a>
      <a href="{{ url_for('salida')  }}" class="tile"><span>SALIDA</span></a>
    </div>

    <!-- FILA 2 -->
    <div class="group secondary">
      <a href="{{ url_for('listados')   }}" class="tile"><span>LISTADOS</span></a>
      <a href="{{ url_for('inventario') }}" class="tile"><span>INVENTARIO</span></a>
      <a href="{{ url_for('admin_index') }}" class="tile"><span>MENÚ ADMIN</span></a>
    </div>
  </div>
</body>
</html>

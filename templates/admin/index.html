<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Menú WMS – Admin</title>
  <style type="text/css">
    /* ====== ESTILO POR DEFECTO (RF: 320x240) ====== */
    body {
      margin:0; padding:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#0057d1;
      color:#fff;
      text-align:center;
    }
    .logo {
      margin:2px auto 4px;
      display:block;
      height:22px;
    }
    .row { width:100%; text-align:center; }
    .btn {
      display:inline-block;
      margin:2px;
      background:#0a55d8;
      color:#fff;
      text-decoration:none;
      font-weight:bold;
      border-radius:4px;
      border:1px solid #003a99;
    }
    .btn-big { width:146px; height:92px; line-height:92px; font-size:14px; }
    .btn-small { width:94px; height:64px; line-height:64px; font-size:12px; }

    /* ====== PC / PANTALLAS GRANDES ====== */
    @media (min-width:600px){
      .logo{margin:10px auto;max-width:320px;height:auto;max-height:80px;}
      .btn-big{width:300px;height:220px;font-size:22px;line-height:220px;}
      .btn-small{width:180px;height:140px;font-size:16px;line-height:140px;}
    }
  </style>
</head>
<body>

  <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="RIMA" class="logo">

  <div class="row">
    <a href="{{ url_for('ingreso') }}" class="btn btn-big">INGRESO</a>
    <a href="{{ url_for('salida') }}" class="btn btn-big">SALIDA</a>
  </div>

  <div class="row">
    <a href="{{ url_for('listados') }}" class="btn btn-small">LISTADOS</a>
    <a href="{{ url_for('inventario') }}" class="btn btn-small">INVENTARIO</a>
    <a href="{{ url_for('admin_index') }}" class="btn btn-small">ADMIN</a>
  </div>

</body>
</html>

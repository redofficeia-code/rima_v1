<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
  "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Gestionar Zonas</title>
  <style type="text/css">
    body { font-family: Arial, Helvetica, sans-serif; background:#f7f2f2; margin:0; }
    .wrap { max-width: 920px; width:94%; margin:12px auto; background:#fff; padding:12px; border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.06); }

    /* topbar sin flex (HTML4 friendly) */
    .topbar { zoom:1; margin-bottom:10px; }
    .topbar:after { content:""; display:block; clear:both; }
    .topbar h2 { float:left; margin:0; font-size:20px; }
    .btn-back { float:right; background:#e9edf3; color:#111; text-decoration:none; padding:10px 14px; border-radius:10px; }

    /* Form */
    .form-inline label { display:block; margin-bottom:6px; }
    .row { zoom:1; }
    .row:after { content:""; display:block; clear:both; }
    .col { float:left; }
    .col.input { width:70%; }
    .col.action { width:30%; text-align:right; }

    input.text {
      width:100%; box-sizing:border-box; padding:12px;
      border:1px solid #cfd6e4; border-radius:10px; font-size:18px;
    }
    button, .btn { display:inline-block; border:0; border-radius:10px; padding:12px 16px; font-size:18px; cursor:pointer; }
    .btn-prim { background:#156ef3; color:#fff; width:100%; }
    .btn-del  { background:#ff4d4f; color:#fff; padding:10px 14px; font-size:16px; }

    /* Tabla normal (desktop) */
    .table-wrap { margin-top:12px; border:1px solid #e9edf3; border-radius:10px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px; border-bottom:1px solid #eef2f6; font-size:16px; }
    th { background:#f0f4fa; text-align:left; }
    th.num, td.num { text-align:right; }
    .td-actions form { display:inline; }

    /* ------- MODO MÓVIL / RF ------- */
    @media (max-width: 720px) {
      .wrap { padding:10px; }
      .topbar h2, .btn-back { float:none; display:block; }
      .btn-back { text-align:center; margin-top:8px; }

      /* Apilar controles del formulario */
      .col, .col.input, .col.action { float:none; width:100%; text-align:left; }
      .form-inline .btn-prim { width:100%; margin-top:8px; }

      /* Tabla -> tarjetas (sin nth-child avanzado) */
      table, thead, tbody, th, td, tr { display:block; }
      thead { display:none; } /* ocultamos cabecera */

      tr { border-bottom:8px solid #f7f2f2; padding:10px; }
      td { border:none; padding:6px 0; }

      /* Etiquetas por columna (orden fijo: ID, Nombre, Acciones) */
      td.id:before      { content:"ID"; display:block; font-weight:bold; color:#5b667a; margin-bottom:2px; }
      td.nombre:before  { content:"Nombre de zona"; display:block; font-weight:bold; color:#5b667a; margin-bottom:2px; }
      td.acc:before     { content:"Acciones"; display:block; font-weight:bold; color:#5b667a; margin-bottom:4px; }

      /* Botón eliminar 100% ancho */
      .td-actions .btn-del { width:100%; padding:12px; font-size:18px; }
    }

    /* Breakpoint extra pequeño (pistolas 360–480px) */
    @media (max-width: 480px) {
      input.text { font-size:20px; padding:14px; }
      .btn-prim { font-size:20px; padding:14px; }
    }
  </style>

  <script type="text/javascript">
    function validarNuevaZona(){
      var el = document.getElementById('nombre');
      var v = (el && el.value ? el.value : '').replace(/^\s+|\s+$/g,'');
      if(v===''){ alert('Ingresa un nombre de zona.'); if(el) el.focus(); return false; }
      return true;
    }
    function confirmarEliminar(nombre){
      return confirm('¿Eliminar la zona ' + nombre + '?');
    }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h2>Gestionar Zonas</h2>
      <a class="btn-back" href="{{ url_for('listados') }}">&#8592; Volver</a>
    </div>

    <form class="form-inline" method="post" action="{{ url_for('zonas_admin_add') }}" onsubmit="return validarNuevaZona();">
      <label for="nombre">Nueva zona:</label>
      <div class="row">
        <div class="col input">
          <input id="nombre" name="nombre" type="text" class="text" placeholder="Ej: La Serena">
        </div>
        <div class="col action">
          <button type="submit" class="btn-prim">Agregar</button>
        </div>
      </div>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre de zona</th>
            <th class="num">Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% for z in zonas %}
          <tr>
            <td class="id">{{ z.ID }}</td>
            <td class="nombre">{{ z.NOMBRE }}</td>
            <td class="num td-actions acc">
              <form method="post"
                    action="{{ url_for('zonas_admin_delete') }}"
                    onsubmit="return confirmarEliminar('{{ z.NOMBRE }}');">
                <input type="hidden" name="id" value="{{ z.ID }}">
                <button type="submit" class="btn-del">Eliminar</button>
              </form>
            </td>
          </tr>
          {% endfor %}
          {% if zonas|length == 0 %}
          <tr><td class="id">—</td><td class="nombre" colspan="2" style="color:#666;">No hay zonas registradas.</td></tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
